# ----------------------- #
#      Main Configs       #
# ----------------------- #

url: https://kerrycanoeclub.com
title: Kerry Canoe Club
email: kerrycanoeclubkillorglin@gmail.com
author: Barry Fitzgerald
description: "Kerry's foremost canoe club"
# Footer shows "Copyright © <build year> " followed by this text
copyright: 'Kerry Canoe Club. All Rights Reserved.'
credits: 'Credits: BF'

# ----------------------- #
#    Jekyll & Plugins     #
# ----------------------- #
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Build settings
markdown: kramdown
permalink: pretty

# Repo docs that should not be published to the site.
# Setting exclude replaces Jekyll's defaults, so those are listed too.
exclude:
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# ----------------------- #
#   3rd Party Settings    #
# ----------------------- #

social:
  - title: Facebook
    url: https://www.facebook.com/kerrycanoeclub/
    icon: facebook
  - title: Email
    url: mailto:kerrycanoeclubkillorglin@gmail.com
    icon: envelope

# Homepage feature blocks (rendered by _includes/page_content.html, no standalone pages)
collections:
  services:
    output: false

defaults:
  # Picture shown when a page is shared on Facebook, WhatsApp etc.
  - scope:
      path: ""
    values:
      image: /img/intro-bg.jpg
  # Keep archived documents out of the sitemap
  - scope:
      path: "assets/documents/archive"
    values:
      sitemap: false
